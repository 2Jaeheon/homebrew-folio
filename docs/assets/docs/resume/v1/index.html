<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤하람 이력서</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'AppleMyungjo','Nanum Myeongjo',serif;color:#111;background:#fff;font-size:15px;line-height:1.8}
main{max-width:680px;margin:0 auto;padding:96px 64px 160px}
h1{font-size:30px;font-weight:400;letter-spacing:.02em}
.role{margin-top:6px;font-size:15px}
.contact{margin-top:4px;font-size:13px;color:#444}
.contact a{color:inherit;text-decoration:none}
.contact b{font-weight:400;margin:0 8px}
section{margin-top:64px}
h2{font-size:16px;font-weight:400;margin-bottom:14px}
p.row{display:flex;justify-content:space-between;margin-top:6px}
p.row span{color:#444;font-size:14px}
ins{text-decoration:none;background:#d6f5d6;border-radius:3px;padding:0 2px}
del{color:#c0392b;background:#fde2e0;text-decoration:line-through;border-radius:3px;padding:0 2px}
</style>
</head>
<body>
<main>
<h1>윤하람</h1>
<p class="role">iOS 개발자 (4년 차)</p>
<p class="contact"><a href="https://example.com">haram@example.com</a><b>/</b><a href="https://example.com">github.com/example</a><b>/</b>서울</p>

<section>
<h2>소개</h2>
<p>SwiftUI로 생활 앱을 만드는 4년 차 iOS 개발자입니다.</p>
</section>

<section>
<h2>경력</h2>
<p class="row">포근랩, iOS 개발자 <span>2024.03 – 현재</span></p>
<p class="row">스튜디오 모래알, 주니어 iOS 개발자 <span>2022.09 – 2024.02</span></p>
</section>

<section>
<h2>학력</h2>
<p class="row">가람대학교 컴퓨터공학과 <span>2016.03 – 2022.08</span></p>
</section>
</main>
</body>
</html>
